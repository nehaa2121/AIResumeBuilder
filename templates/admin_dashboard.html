<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

<h1 style="text-align:center;">Admin Dashboard</h1>

<div style="text-align:center;">
    <a href="/admin_logout"><button>Logout</button></a>
</div>

<h2>Users</h2>
<table border="1" width="100%">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Action</th>
</tr>

{% for user in users %}
<tr>
    <td>{{ user[0] }}</td>
    <td>{{ user[1] }}</td>
    <td>{{ user[2] }}</td>
    <td>
        <a href="/delete_user/{{ user[0] }}">
            <button>Delete</button>
        </a>
    </td>
</tr>
{% endfor %}
</table>

<h2>Resumes</h2>
<table border="1" width="100%">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Action</th>
</tr>

{% for r in resumes %}
<tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>
        <a href="/delete_resume/{{ r[0] }}">
            <button>Delete</button>
        </a>
    </td>
</tr>
{% endfor %}
</table>

</body>
</html>
